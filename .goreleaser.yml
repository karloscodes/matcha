version: 2

builds:
  - main: ./cmd/matcha
    binary: matcha-{{ .Os }}-{{ .Arch }}
    no_unique_dist_dir: true
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - format: binary
    name_template: "{{ .Binary }}"

checksum:
  name_template: checksums.txt

release:
  github:
    owner: karloscodes
    name: matcha

changelog:
  sort: asc
